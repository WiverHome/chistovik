<!doctype html>
<!--
  Исходник баннера README. Дизайн-система WiverHome, направление A «Чертёж».
  Размер макета 1280×400. Светлая тема по умолчанию, тёмная — по prefers-color-scheme
  или по адресу banner.html#dark (так снимается docs/banner-dark.png).
  PNG: docs/make-banner.ps1 (нужен Microsoft Edge и доступ к Google Fonts).
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Чистовик — баннер README</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..800&family=JetBrains+Mono:wght@400;500&display=block&subset=cyrillic">
<style>
  :root {
    --surface: #fbfbf9;
    --surface-raised: #ffffff;
    --ink: #16171a;
    --ink-muted: #5e626a;
    --line: #e6e5e0;
    --line-strong: #80848c;
    --brand: #3552d4;
    --brand-soft: #eceffc;
    --sans: "Golos Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", "Cascadia Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #0d0e10; --surface-raised: #16171a; --ink: #f1f1ee; --ink-muted: #a3a6ad;
      --line: #26272c; --line-strong: #6b6f77; --brand: #93a5ff; --brand-soft: #1b2038;
    }
  }
  :root[data-theme="dark"] {
    --surface: #0d0e10; --surface-raised: #16171a; --ink: #f1f1ee; --ink-muted: #a3a6ad;
    --line: #26272c; --line-strong: #6b6f77; --brand: #93a5ff; --brand-soft: #1b2038;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 400px; overflow: hidden; background: var(--surface); }
  body { position: relative; font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }

  .grid { position: absolute; inset: 0; width: 1280px; height: 400px; }
  .grid .minor { stroke: var(--line); stroke-width: 1; opacity: .55; }
  .frame { fill: none; stroke: var(--line); stroke-width: 1; }

  .label {
    position: absolute; left: 72px; top: 62px;
    font: 500 13px/16px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted);
  }
  h1 {
    position: absolute; left: 68px; top: 104px;
    font: 650 128px/1 var(--sans); letter-spacing: -0.03em; color: var(--ink);
  }
  .benefit {
    position: absolute; left: 72px; top: 252px;
    font: 400 32px/42px var(--sans); letter-spacing: -0.01em; color: var(--ink);
  }
  .benefit b { font-weight: 650; }
  .brand {
    position: absolute; left: 72px; bottom: 44px;
    font: 650 16px/20px var(--sans); letter-spacing: -0.005em; color: var(--ink);
  }
  .brand span { font: 400 13px/20px var(--mono); color: var(--ink-muted); margin-left: 10px; }

  .legend { position: absolute; left: 728px; top: 304px; width: 200px; }
  .legend .k { font: 600 12px/16px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
  .legend .v { margin-top: 6px; font: 500 18px/24px var(--mono); color: var(--brand); white-space: nowrap; }

  .sheet { position: absolute; left: 860px; top: 0; width: 420px; height: 400px; }
  .sheet text { font-family: var(--sans); }
  .sheet .m { font: 500 10px var(--mono); fill: var(--brand); text-anchor: middle; }
  .sheet .mono { font-family: var(--mono); }
</style>
</head>
<body>
  <script>
    // banner.html#dark принудительно включает тёмную тему (для съёмки PNG)
    if (location.hash === "#dark") document.documentElement.dataset.theme = "dark";
    if (location.hash === "#light") document.documentElement.dataset.theme = "light";
  </script>

  <!-- Сетка чертёжного листа: шаг 20, каждая вторая линия плотнее -->
  <svg class="grid" viewBox="0 0 1280 400" aria-hidden="true">
    <g class="minor">
      <path d="M20 0V400M60 0V400M100 0V400M140 0V400M180 0V400M220 0V400M260 0V400M300 0V400M340 0V400M380 0V400M420 0V400M460 0V400M500 0V400M540 0V400M580 0V400M620 0V400M660 0V400M700 0V400M740 0V400M780 0V400M820 0V400M860 0V400M900 0V400M940 0V400M980 0V400M1020 0V400M1060 0V400M1100 0V400M1140 0V400M1180 0V400M1220 0V400M1260 0V400"/>
      <path d="M0 20H1280M0 60H1280M0 100H1280M0 140H1280M0 180H1280M0 220H1280M0 260H1280M0 300H1280M0 340H1280M0 380H1280"/>
    </g>
    <rect class="frame" x=".5" y=".5" width="1279" height="399"/>
  </svg>

  <div class="label">Шаблоны студенческих работ для Word</div>
  <h1>Чистовик</h1>
  <p class="benefit">Курсовая, ВКР, реферат&nbsp;— сразу по&nbsp;ГОСТ</p>
  <div class="brand">WiverHome<span>github.com/WiverHome/chistovik</span></div>

  <div class="legend">
    <div class="k">Поля, мм</div>
    <div class="v">30 / 15 / 20 / 20</div>
  </div>

  <!-- Фрагмент мира проекта: титульный лист А4 с полями 30/15/20/20 мм, как на чертеже.
       Масштаб 1,19 px на 1 мм: лист 250×353, поля 35,7 / 17,9 / 23,8 / 23,8 px -->
  <svg class="sheet" viewBox="0 0 420 400" aria-hidden="true">
    <!-- лист и поля -->
    <rect x="100" y="23" width="250" height="354" rx="2" fill="var(--brand-soft)" stroke="var(--line-strong)"/>
    <rect x="135.7" y="46.8" width="196.4" height="306.4" fill="var(--surface-raised)" stroke="var(--brand)" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- содержимое титульного листа -->
    <g fill="var(--ink-muted)" opacity=".55">
      <rect x="159" y="62" width="150" height="3" rx="1.5"/>
      <rect x="179" y="72" width="110" height="3" rx="1.5"/>
      <rect x="199" y="82" width="70" height="3" rx="1.5"/>
    </g>
    <text x="234" y="156" text-anchor="middle" font-size="13" font-weight="650" letter-spacing="-0.01" fill="var(--ink)">КУРСОВАЯ РАБОТА</text>
    <text x="234" y="174" text-anchor="middle" class="mono" font-size="8" fill="var(--ink-muted)">[Тема работы]</text>
    <g class="mono" font-size="7.5" fill="var(--ink-muted)">
      <text x="206" y="268">Выполнил:</text><text x="262" y="268" fill="var(--brand)">[ФИО]</text>
      <text x="206" y="283">Группа:</text><text x="262" y="283" fill="var(--brand)">[группа]</text>
      <text x="206" y="298">Руководитель:</text><text x="262" y="298" fill="var(--brand)">[ФИО]</text>
      <text x="234" y="338" text-anchor="middle">[Город] [год]</text>
    </g>

    <!-- размерные линии (стрелки с засечками), подписи в мм -->
    <g stroke="var(--brand)" stroke-width="1" fill="none">
      <!-- левое поле 30 -->
      <path d="M100 205H135.7M100 200V210M135.7 200V210"/>
      <!-- правое поле 15 -->
      <path d="M332.1 205H350M332.1 200V210M350 200V210"/>
      <!-- верхнее поле 20 -->
      <path d="M284 23V46.8M279 23H289M279 46.8H289"/>
      <!-- нижнее поле 20 -->
      <path d="M284 353.2V377M279 353.2H289M279 377H289"/>
    </g>
    <text class="m" x="117.8" y="199">30</text>
    <text class="m" x="341" y="199">15</text>
    <text class="m" x="298" y="39.5">20</text>
    <text class="m" x="298" y="369.5">20</text>
  </svg>
</body>
</html>
